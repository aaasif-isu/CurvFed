# =====================================================================
# CurvFed Central Experiment Configuration (YAML)
# =====================================================================
# Edit any parameter below and run:
#   ./curvfed/bin/python scripts/run_experiment.py
# Or specify a custom YAML file:
#   ./curvfed/bin/python scripts/run_experiment.py --config config.yaml
# =====================================================================

# ---------------------------------------------------------------------
# 1. Aggregation Method & Run Mode
# ---------------------------------------------------------------------
# Options for method:
#   - "baseline" / "fedavg": Standard SplitFedV1 (uniform FedAvg)
#   - "emd_only"           : EMD distance matrix + Agglomerative Clustering
#   - "emd_orc" / "curvfed": EMD + Ollivier-Ricci Curvature (ORC) shortest-path clustering
#   - "emd_orc_weighted"   : Sample-weighted EMD + ORC clustering
#   - "fedwad"             : Federated Wasserstein Distance (FedWaD / FedOTDD) clustering
#   - "tca"                : Transport-Curvature Aggregation (Phase 2)
method: "tca"

# Set smoke_test: true for a fast CPU test preset (MNIST + SmallCNN, 4 clients, 2 rounds)
smoke_test: false

# ---------------------------------------------------------------------
# 2. Dataset & Split Model Architecture
# ---------------------------------------------------------------------
# Valid (dataset, model) pairs:
#   - dataset: "cifar10",     model: "resnet18" (or "smallcnn")
#   - dataset: "mnist",       model: "resnet18" (or "smallcnn")
#   - dataset: "shakespeare", model: "charlstm"
dataset: "cifar10"
model: "resnet18"

# ---------------------------------------------------------------------
# 3. Federated Client & Data Partition Settings
# ---------------------------------------------------------------------
num_users: 10           # Total number of clients (4, 10, or 100)
frac: 1.0               # Fraction of active clients per round (e.g., 1.0 for 10 clients, 0.1 for 100 clients)
alpha: 0.1              # Dirichlet non-IID parameter: 0.1, 0.5, 1.0, or 999999 (for IID)
seed: 42                # Random seed for reproducibility

# ---------------------------------------------------------------------
# 4. Training Hyperparameters
# ---------------------------------------------------------------------
global_rounds: 50       # Number of global communication rounds
local_epochs: 1         # Number of local epochs per active client per round
learning_rate: 0.0001   # Adam optimizer learning rate (client & server)
batch_size: 256         # Training and evaluation batch size

# Optional sample caps (set to null for full dataset, or an integer like 512 for quick tests)
max_samples_per_client: null
max_test_samples: null

# ---------------------------------------------------------------------
# 5. CurvFed Geometry, Clustering & Sanity-Check Controls
# ---------------------------------------------------------------------
n_clusters: 3                      # Number of client clusters per round (1 <= n_clusters <= active clients)
cluster_mode: "geometry"           # "geometry" (true EMD/ORC clusters) or "random" (random clusters of same sizes)
zscore_mode: "pooled"              # Activation normalization before EMD: "per_client", "pooled", or "none"
consistent_split_weights: true     # true: clusterwise_fedavg on both client & server; false: server only
run_noise_floor: true              # true: run Sanity Check A (within- vs cross-client EMD SNR)

# ---------------------------------------------------------------------
# 5b. Phase 2: Transport-Curvature Aggregation (TCA) Controls
# ---------------------------------------------------------------------
tca:
  mode: "decoupled"         # "decoupled" (start from global model) or "feedback" (start from personalized model)
  cost: "update"            # "update" (pairwise delta L2 distance) or "emd" (smashed activation EMD)
  marginal: "hard"          # "hard" (doubly constrained: A 1 = 1 and v^T A = v^T) or "none" (row-only: A 1 = 1)
  calibrate: false          # true: apply lazy_calibrate(A, median_q, kappa_target) before aggregating
  kappa_target: "auto"      # "auto" (= mean kappa of uncalibrated plan) or a float number (e.g. 0.25)
  reg: 1.0                  # Quadratic regularization weight for solving A

# ---------------------------------------------------------------------
# 6. Output & Logging Settings
# ---------------------------------------------------------------------
output_dir: null        # null = auto-generate under results/, or set e.g. "results/my_experiment"
save_excel: true        # Save .xlsx workbook in addition to round_metrics.csv

# ---------------------------------------------------------------------
# 7. FedWaD Settings (used when method: "fedwad" or running SplitFed_EMD_FedWaD.py)
# ---------------------------------------------------------------------
distance_method: "fedwad"   # "emd" or "fedwad"
fedwad_n_supp: 10           # Number of interpolating measure support points
fedwad_epochs: 20           # Optimization epochs for free-support interpolating measure
fedwad_t: 0.5               # Interpolation parameter t in (0, 1)
distance_pool_size: 1       # Adaptive average pooling spatial size for 2D feature maps

# ---------------------------------------------------------------------
# 8. Fixed Dataset Paths & CharLSTM Architecture Settings
# ---------------------------------------------------------------------
data_root: "data"
shakespeare_text_path: "data/shakespeare/input.txt"
shakespeare_download_url: "https://raw.githubusercontent.com/karpathy/char-rnn/master/data/tinyshakespeare/input.txt"
shakespeare_train_fraction: 0.9
shakespeare_sequence_length: 80
charlstm_embed_dim: 8
charlstm_hidden_size: 256
charlstm_num_layers: 2
